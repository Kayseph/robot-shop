apiVersion: apps/v1
kind: Deployment
metadata:
  name: user
  labels:
    service: user
spec:
  replicas: 1
  selector:
    matchLabels:
      service: user
  template:
    metadata:
      labels:
        service: user
    spec:
      {{ if .Values.psp.enabled }}
      serviceAccountName: robot-shop
      {{ end }}
      containers:
      - name: user
        image: {{ .Values.user.image | default (printf "%s/rs-user:%s" .Values.image.repo .Values.image.version) }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: OTEL_SERVICE_NAME
          value: robot-shop-user
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://jaeger.monitoring.svc.cluster.local:4318/v1/traces
        - name: OTEL_TRACES_EXPORTER
          value: otlp
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
      restartPolicy: Always
      {{- with .Values.user.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.user.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.user.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
